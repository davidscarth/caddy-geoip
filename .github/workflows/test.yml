name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Latest stable Go, stdlib vulnerabilities are fixed by
      # the building toolchain, and govulncheck reports them
      # against whatever built the binary.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: go mod tidy leaves no changes
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
